name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build WritersKiosk.csproj -c Release -warnaserror

      - name: Test
        run: dotnet test tests/WritersKiosk.Tests/WritersKiosk.Tests.csproj -c Release
